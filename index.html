<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RxBOT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Brand Palette from Guidelines Page 16
              'z-deep-teal': '#204D4C', // Primary Dark
              'z-green': '#51A090',     // Accent
              'z-sky': '#AEE0E8',       // Primary Light 1
              'z-pale-green': '#D9ECD2',// Primary Light 2
              'z-light-green': '#E4F2E7',// Primary Light 3
              'z-ivory': '#F5FAF2',     // Background / Off-white
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      .typing-dot {
        animation: typing 1.4s infinite ease-in-out both;
      }
      .typing-dot:nth-child(1) { animation-delay: -0.32s; }
      .typing-dot:nth-child(2) { animation-delay: -0.16s; }
      
      @keyframes typing {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out forwards;
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.5s ease-out forwards;
      }
      .animate-scale-in {
        animation: scaleIn 0.3s ease-out forwards;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      /* Placeholder Focus Animation */
      @keyframes placeholder-focus-fade {
        0% { opacity: 1; color: #94a3b8; } /* slate-400 */
        50% { opacity: 0.2; }
        100% { opacity: 1; color: #51A090; } /* z-green (different shade) */
      }
      .focus-animate-placeholder:focus::placeholder {
        animation: placeholder-focus-fade 0.8s ease-in-out forwards;
      }

      /* 7-Color Rainbow Rotating Border Effect */
      @keyframes rainbow-rotate {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      .rainbow-border-wrapper {
        position: relative;
        border-radius: 1rem;
        padding: 2.5px;
        overflow: hidden;
      }

      .rainbow-border-wrapper::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1400px;
        height: 1400px;
        transform: translate(-50%, -50%);
        background: conic-gradient(
          #ff1744, /* 1. Red */
          #ff9100, /* 2. Orange */
          #ffea00, /* 3. Yellow */
          #00e676, /* 4. Green */
          #00b0ff, /* 5. Blue */
          #3d5afe, /* 6. Indigo */
          #d500f9, /* 7. Violet */
          #ff1744  /* Loop back to Red */
        );
        animation: rainbow-rotate 3.5s linear infinite;
        z-index: 0;
      }

      .rainbow-glow {
        position: absolute;
        inset: -3px;
        border-radius: 1.25rem;
        overflow: hidden;
        filter: blur(14px);
        opacity: 0.6;
        pointer-events: none;
      }

      .rainbow-glow::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1400px;
        height: 1400px;
        transform: translate(-50%, -50%);
        background: conic-gradient(
          #ff1744,
          #ff9100,
          #ffea00,
          #00e676,
          #00b0ff,
          #3d5afe,
          #d500f9,
          #ff1744
        );
        animation: rainbow-rotate 3.5s linear infinite;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-gradient-to-tr from-z-sky via-z-pale-green to-z-light-green bg-fixed text-slate-900 font-sans antialiased">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        console.error('Captured window error:', event.error || event.message);
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          var errBox = document.getElementById('app-fallback-error');
          if (!errBox) {
            errBox = document.createElement('div');
            errBox.id = 'app-fallback-error';
            errBox.style.cssText = 'min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; font-family: sans-serif;';
            errBox.innerHTML = '<div style="background: white; border-radius: 1rem; padding: 2rem; max-width: 500px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; border: 1px solid #E4F2E7;">' +
              '<h2 style="color: #204D4C; margin: 0 0 0.5rem; font-size: 1.25rem; font-weight: bold;">RxBOT Initializing</h2>' +
              '<p style="color: #64748b; font-size: 0.875rem; margin-bottom: 1rem;">An unexpected script error occurred during initialization.</p>' +
              '<pre style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.75rem; color: #dc2626; text-align: left; overflow-x: auto; white-space: pre-wrap;">' +
              (event.message || 'Script error occurred') +
              '</pre>' +
              '<button onclick="window.location.reload()" style="margin-top: 1rem; padding: 0.6rem 1.25rem; background: #204D4C; color: white; border: none; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 500; cursor: pointer;">Reload Application</button>' +
              '</div>';
            document.body.appendChild(errBox);
          }
        }
      });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
